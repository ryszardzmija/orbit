name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate (${{ matrix.preset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, sanitizers]
    env:
      PRESET: ${{ matrix.preset }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-15 git ninja-build python3

      - name: Install sanitizer toolchain
        if: matrix.preset == 'sanitizers'
        run: sudo apt-get install -y clang-22 libclang-rt-22-dev

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build
        id: build
        run: cmake --build --preset "$PRESET"

      - name: Run unit tests
        run: ctest --preset "$PRESET" -L '^unit$' --output-log "build/$PRESET/ctest-unit.log"

      - name: Run integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --preset "$PRESET" -L '^integration$' --output-log "build/$PRESET/ctest-integration.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: diagnostics-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/ctest-*.log
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore
